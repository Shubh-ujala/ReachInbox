services:
  # ── Backend API & In-Process Worker ──────────────────────────────────────────
  - type: web
    name: email-scheduler-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: email-scheduler-redis
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: email-scheduler-client
          property: url
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # ── Frontend Web App (Vite React SPA) ─────────────────────────────────────────
  - type: web
    name: email-scheduler-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: email-scheduler-api
          property: url
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

  # ── Managed Redis ────────────────────────────────────────────────────────────
  - type: redis
    name: email-scheduler-redis
    plan: free
    ipAllowList: [] # internal access only
